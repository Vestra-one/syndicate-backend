name: ci

on:
  push:
    branches: [main]
  pull_request:

# The determinism + conservation + parity suites are the merge gate: a red run means the
# chain could disagree with the off-chain builders — a foundation-level regression.
jobs:
  rust-core:
    name: Rust workspace (determinism + conservation gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (workspace)
        run: cargo test --workspace

  anchor-program:
    name: Anchor program (build + litesvm + chain byte-parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build program (platform tools v1.53)
        working-directory: services/programs
        run: cargo build-sbf --tools-version v1.53 -- -p syndicate-program
      - name: litesvm suite (lifecycle, funds-exit matrix, chain parity)
        working-directory: services/programs/litesvm-tests
        run: cargo test
