[package]
name = "syndicate-shared"
version = "0.1.0"
edition = "2021"
description = "Syndicate deterministic core: integer money math, side-pot construction, Pyth oracle metadata, winner/tie logic, replay. Zero external dependencies (so it builds anywhere and is byte-identical to the on-chain validator)."

[lib]
name = "syndicate_shared"
path = "src/lib.rs"

[dependencies]
# Kept minimal for determinism + portability. sha2 is pure Rust and no_std-capable
# (default features off), so the crate builds anywhere and the commitment hash is the
# real SHA-256 shared with the frontend and settlement worker.
sha2 = { version = "0.10", default-features = false }
