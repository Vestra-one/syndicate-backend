[package]
name = "syndicate-orchestrator"
version = "0.1.0"
edition = "2021"
description = "Match lifecycle orchestrator: formation bootstrap, lock, void, engine start."

[[bin]]
name = "syndicate-orchestrator"
path = "src/main.rs"

[dependencies]
syndicate-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
