[package]
name = "syndicate-game-server"
version = "0.1.0"
edition = "2021"
description = "Syndicate v2 game server: REST + WebSocket, lobby/rooms, seat verification, in-process betting engine"

[lib]
name = "syndicate_game_server"
path = "src/lib.rs"

[[bin]]
name = "syndicate-game-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "net"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.22"
bs58 = "0.5"
sha2 = "0.10"
rand = "0.8"
dashmap = "5"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
solana-sdk = "2.2"
solana-client = "2.2"

syndicate-shared = { path = "../shared" }
syndicate-store = { path = "../store" }
syndicate-engine = { path = "../match-engine", package = "syndicate-match-runtime" }
syndicate-chain = { path = "../chain", features = ["rpc"] }

[dev-dependencies]
ed25519-dalek = "2"
tokio-tungstenite = "0.20"
