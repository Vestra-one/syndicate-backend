[package]
name = "syndicate-settlement"
version = "0.1.0"
edition = "2021"
description = "Settlement service: the convergence point. Wires the match engine, verified Pyth oracle price, and time-lock together, computes the outcome via syndicate-shared, builds the on-chain submission bundle, and orchestrates VOID/refund on any guard failure. All outcome math is delegated to syndicate-shared."

[dependencies]
async-trait = "0.1"
syndicate-shared = { path = "../shared" }
syndicate-engine = { path = "../match-engine" }
syndicate-timelock = { path = "../timelock" }
syndicate-store = { path = "../store" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
ureq = { version = "2", features = ["json"], optional = true }
async-nats = { version = "0.38", optional = true }
tokio-postgres = { version = "0.7", optional = true }
deadpool-postgres = { version = "0.14", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "pg_attempt_store"
required-features = ["pg"]

[features]
default = []
net = ["dep:serde", "dep:serde_json", "dep:sha2", "dep:ureq"]
pg = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:serde_json"]
nats = ["dep:async-nats", "dep:serde", "dep:serde_json"]
