[package]
name = "syndicate-program"
version = "0.1.0"
edition = "2021"
description = "Syndicate Solana/Anchor on-chain program: vault custody, deposits/claims/refunds, fees, and v1 backend-trusted settlement with conservation + signed-price checks."

[lib]
crate-type = ["cdylib", "lib"]
name = "syndicate_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
solana-keccak-hasher = "2.2.1"
solana-secp256k1-recover = "2.2.1"
# The deterministic core for signed-price validation types.
syndicate-shared = { path = "../../../shared" }
