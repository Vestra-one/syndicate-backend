[package]
name = "syndicate-program-litesvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace root: this crate lives under services/programs/ (itself an Anchor
# workspace) but is not one of its members, so it must declare its own workspace.
[workspace]

[dependencies]
litesvm = "0.6"
solana-sdk = "2.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
spl-token = "7"
borsh = "0.10"
engine_borsh = { package = "borsh", version = "1" }
serde_json = "1"
hex = "0.4"
syndicate-shared = { path = "../../shared" }
syndicate-engine-core = { path = "../../engine-core" }

[dev-dependencies]
# Host-side secp256k1 signing to produce a real recoverable EIP-191 signature for the
# settlement signed-price path (recovered on-chain by solana-secp256k1-recover). Same
# crate the contract uses transitively, so wire-compatible.
libsecp256k1 = "0.6"
solana-keccak-hasher = "2"
# Byte-parity gate: the host chain layer must encode exactly what the program decodes.
syndicate-chain = { path = "../../chain" }

[[test]]
name = "funds_exit_matrix"
path = "tests/funds_exit_matrix.rs"

[[test]]
name = "golden_parity"
path = "tests/golden_parity.rs"

[[test]]
name = "intent_verification"
path = "tests/intent_verification.rs"
