[package]
name = "syndicate-program-litesvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace root: this crate lives under services/programs/ (itself an Anchor
# workspace) but is not one of its members, so it must declare its own workspace.
[workspace]

[dependencies]
litesvm = "0.6"
solana-sdk = "2.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
spl-token = "7"
borsh = "0.10"
engine_borsh = { package = "borsh", version = "1" }
serde_json = "1"
hex = "0.4"
syndicate-shared = { path = "../../shared" }
syndicate-engine-core = { path = "../../engine-core" }

[[test]]
name = "golden_parity"
path = "tests/golden_parity.rs"

[[test]]
name = "intent_verification"
path = "tests/intent_verification.rs"
