# Anchor workspace config for the Syndicate on-chain program.
# Build/test in a Solana CI:  anchor build  &&  anchor test
# (The Solana platform toolchain is not available in the doc-authoring sandbox, so
#  this crate is source-complete but compiled/verified in the Solana pipeline.)

[toolchain]
anchor_version = "0.30.1"

[programs.localnet]
syndicate_program = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
