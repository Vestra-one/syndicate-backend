[package]
name = "syndicate-engine"
version = "0.1.0"
edition = "2021"
description = "Authoritative match engine core: state machine, betting legality, turn order, contribution tracking, end-condition detection. Pure + deterministic; produces the settlement inputs consumed by syndicate-shared. Networking/persistence (tokio, lease) layer on top."

[lib]
name = "syndicate_engine"
path = "src/lib.rs"

[[bin]]
name = "syndicate-match-engine"
path = "src/main.rs"

[dependencies]
syndicate-shared = { path = "../shared" }
syndicate-engine-core = { path = "../engine-core" }
ed25519-dalek = { version = "2", features = ["std"] }
bs58 = "0.5"
base64 = "0.22"
syndicate-store = { path = "../store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = "0.14"
uuid = { version = "1", features = ["serde"] }
redis = { version = "0.27", features = ["tokio-comp"] }
