[package]
name = "syndicate-match-runtime"
version = "0.1.0"
edition = "2021"
description = "Authoritative match runtime library: fenced replay-safe runtime around the pure engine core (FencedMatchRuntime), ed25519 intent verification, and Postgres match persistence. Consumed by the game-server actor loop and the chain-worker reconstructor."

[lib]
name = "syndicate_match_runtime"
path = "src/lib.rs"

[dependencies]
syndicate-shared = { path = "../shared" }
syndicate-engine-core = { path = "../engine-core" }
ed25519-dalek = { version = "2", features = ["std"] }
bs58 = "0.5"
base64 = "0.22"
syndicate-store = { path = "../store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = "0.14"
uuid = { version = "1", features = ["serde"] }
