[package]
name = "syndicate-timelock"
version = "0.1.0"
edition = "2021"
description = "Time-lock encryption core + real drand beacon client. Seal registry with pre-LIVE binding; auto-decrypt at match end; missing-key→VOID. The drand HTTP client is real (structs/parsers tested offline); the live fetch is behind the `net` feature. The IBE (tlock) scheme plugs into TimelockScheme."

[lib]
name = "syndicate_timelock"
path = "src/lib.rs"

[dependencies]
syndicate-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", optional = true }
tlock_age = { version = "0.0.8", optional = true }

[features]
# Enables the live drand HTTP client (ureq). Off by default so the core builds/tests
# with zero network deps; CI turns it on for live-beacon integration.
net = ["dep:ureq"]
# Enables the real drand `tlock` IBE cipher (BLS12-381). Off by default to keep the
# core build light; the live round-trip test needs `tlock` + `net`.
tlock = ["dep:tlock_age"]
