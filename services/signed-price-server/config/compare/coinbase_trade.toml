# Comparison test: Coinbase last_trade feed on :18082

[server]
listen_addr = ":18082"
max_connections = 100
read_buffer_size = 1024
write_buffer_size = 1024
shutdown_timeout = 30

[signing]
num_workers = 0
trade_queue_size = 100000
signed_queue_size = 100000

[store]
history_capacity = 10000

[book_mid]
emit_interval_ms = 50
max_book_age_ms = 10000

[hub]
client_queue_size = 100000
client_send_buffer_size = 4096
ping_interval = 30
write_timeout = 10

[[currency_pairs]]
base = "BTC"
quote = "USD"
token = "0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf"
providers = ["coinbase"]

[[currency_pairs]]
base = "ETH"
quote = "USD"
token = "0x4200000000000000000000000000000000000006"
providers = ["coinbase"]

# USDC-USD is not listed on Coinbase Exchange (only USDC-EUR, USDC-GBP, etc.)

[[provider_endpoints]]
name = "coinbase"
websocket = "ws-feed.exchange.coinbase.com"
rest = "https://api.exchange.coinbase.com"

[[token_mappings]]
symbol = "BTCUSD"
address = "0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf"

[[token_mappings]]
symbol = "ETHUSD"
address = "0x4200000000000000000000000000000000000006"

[logging]
level = "warn"
format = "console"

[metrics]
path = "/metrics"
