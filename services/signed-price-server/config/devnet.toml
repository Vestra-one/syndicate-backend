# Syndicate devnet signed-price-server configuration.

[server]
listen_addr = ":8080"
max_connections = 12000
read_buffer_size = 1024
write_buffer_size = 1024
shutdown_timeout = "30s"

[signing]
num_workers = 0
trade_queue_size = 100000
signed_queue_size = 100000

[store]
history_capacity = 100000
sqlite_path = "data/signed-prices-devnet.sqlite"

[book_mid]
emit_interval_ms = 45
max_book_age_ms = 2000
stale_watchdog_interval_ms = 1000
stale_threshold_ms = 5000
stale_reconnect_cooldown_ms = 30000

[hub]
client_queue_size = 200000
client_send_buffer_size = 256
ping_interval = "30s"
write_timeout = "10s"

[[currency_pairs]]
base = "SOL"
quote = "USD"
token = "0xD31a59c85aE9D8edEFeC411D448f90841571b89c"
providers = ["coinbase"]
provider_price_modes = { coinbase = "book_mid" }

[[currency_pairs]]
base = "BTC"
quote = "USD"
token = "0xa7BaE7da3E4950700BE9f107EB186e89a474d180"
providers = ["coinbase"]
provider_price_modes = { coinbase = "book_mid" }

[[currency_pairs]]
base = "ETH"
quote = "USD"
token = "0x6Dd0C6a2e058bc3F7D6AaCe23965180BcBbb2635"
providers = ["coinbase"]
provider_price_modes = { coinbase = "book_mid" }

[[provider_endpoints]]
name = "coinbase"
websocket = "ws-feed.exchange.coinbase.com"
rest = "https://api.exchange.coinbase.com"

[[token_mappings]]
symbol = "SOLUSD"
address = "0xD31a59c85aE9D8edEFeC411D448f90841571b89c"

[[token_mappings]]
symbol = "BTCUSD"
address = "0xa7BaE7da3E4950700BE9f107EB186e89a474d180"

[[token_mappings]]
symbol = "ETHUSD"
address = "0x6Dd0C6a2e058bc3F7D6AaCe23965180BcBbb2635"

provider_timeout = "100ms"

[logging]
level = "info"
format = "json"

[metrics]
enabled = true
path = "/metrics"

[failover]
enabled = false
