[package]
name = "syndicate-chain-worker"
version = "0.1.0"
edition = "2021"
description = "Chain worker daemon: claims chain_jobs from Postgres (LISTEN + poll), builds/signs/submits Solana transactions via syndicate-chain, and runs the v2 settlement pipeline (engine replay, drand timelock open, signed-price oracle, payout mapping) with capital-safe VOID fallbacks."

[lib]
name = "syndicate_chain_worker"
path = "src/lib.rs"

[[bin]]
name = "syndicate-chain-worker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "net", "io-util"] }
async-trait = "0.1"
futures-util = "0.3"
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

solana-sdk = "2.2"
solana-client = "2.2"
solana-transaction-status = "2.2"

syndicate-chain = { path = "../chain", features = ["rpc"] }
syndicate-shared = { path = "../shared" }
syndicate-engine = { path = "../match-engine", package = "syndicate-match-runtime" }
syndicate-timelock = { path = "../timelock", features = ["net", "tlock"] }
syndicate-store = { path = "../store" }

[dev-dependencies]
borsh = "0.10"
