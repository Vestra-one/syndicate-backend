# Syndicate v2 Postgres tuning (single-VPS, 8 GB host, ~200 tx/s event-append workload).
listen_addresses = '*'
max_connections = 200

shared_buffers = 2GB
effective_cache_size = 4GB
work_mem = 16MB
maintenance_work_mem = 256MB

# Event log is the source of truth: never trade durability for speed.
synchronous_commit = on
wal_level = replica
max_wal_size = 2GB
checkpoint_completion_target = 0.9

random_page_cost = 1.1          # NVMe
effective_io_concurrency = 200

log_min_duration_statement = 250ms
log_line_prefix = '%m [%p] %q%u@%d '
