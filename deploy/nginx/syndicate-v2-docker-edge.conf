# Syndicate v2 — vhost for ANOTHER project's Dockerized nginx (shared edge).
#
# Use with deploy/docker-compose.shared-edge.yml, which puts game-server and
# signed-price-server on that nginx's Docker network as satoshi-game-server /
# satoshi-price-server. Drop the rendered file into that nginx's conf.d and reload it.
#
# Placeholders: __API_HOST__, __PRICE_HOST__.
# Upstreams are variables (resolved at request time through Docker DNS) so the other
# project's nginx still starts, and keeps serving its own sites, when this stack is down.
#
# Two stages, because nginx refuses to start when a cert file is missing:
#   1. HTTP-only (the "# ---- https" section removed): serves ACME challenges.
#   2. After certbot --webroot issues the cert: the full file.

map $http_upgrade $syndicate_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __API_HOST__ __PRICE_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- https ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __API_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__API_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 256k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $syndicate_api http://satoshi-game-server:8080;

    location /v1/ws {
        proxy_pass $syndicate_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $syndicate_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass $syndicate_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __PRICE_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__API_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $syndicate_price http://satoshi-price-server:8080;

    # Never expose the failover admin / metrics routes to the internet.
    location ~* ^/(internal|metrics) { return 404; }

    location /ws {
        proxy_pass $syndicate_price;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $syndicate_conn_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass $syndicate_price;
        proxy_set_header Host $host;
    }
}
