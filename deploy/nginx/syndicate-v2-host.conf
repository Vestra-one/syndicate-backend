# Syndicate v2 — HOST nginx vhost (systemd nginx already running on the VPS).
#
# This is NOT the Docker nginx (deploy/docker-compose.yml's `nginx` service). On this VPS
# the host's system nginx owns 80/443 for the other services, so the bundled Docker nginx
# must stay OFF. The v2 containers publish to loopback only (127.0.0.1) via
# docker-compose.devnet.yml; this vhost terminates TLS and proxies to them.
#
# v2 collapses the old 4 services into ONE API (game-server: REST + WS) + the price feed.
#
#   api.<domain>   -> 127.0.0.1:18080   game-server   (REST + WebSocket /v1/ws)
#   price.<domain> -> 127.0.0.1:18088   signed-price-server (read-only)
#
# Install (as the deploy user):
#   sudo cp deploy/nginx/syndicate-v2-host.conf /etc/nginx/sites-available/syndicate-v2
#   sudo ln -s /etc/nginx/sites-available/syndicate-v2 /etc/nginx/sites-enabled/syndicate-v2
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.<domain> -d price.<domain> --agree-tos -m you@<domain>
# certbot injects the `listen 443 ssl` + cert directives and the HTTP->HTTPS redirect.
#
# EDIT the two server_name lines below for your domain (defaults use the devnet subdomains).

# Uniquely named to avoid clashing with a $connection_upgrade map another vhost may define.
map $http_upgrade $syndicate_conn_upgrade {
    default upgrade;
    ''      close;
}

# --- game-server: REST + WebSocket -------------------------------------------------
server {
    listen 80;
    server_name api.devnet.satoshitable.fun;

    client_max_body_size 256k;

    location /v1/ws {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $syndicate_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- signed-price-server: read-only public feed ------------------------------------
server {
    listen 80;
    server_name price.devnet.satoshitable.fun;

    # Never expose the failover admin / metrics routes to the internet.
    location ~* ^/(internal|metrics) { return 404; }

    location /ws {
        proxy_pass http://127.0.0.1:18088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $syndicate_conn_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18088;
        proxy_set_header Host $host;
    }
}
