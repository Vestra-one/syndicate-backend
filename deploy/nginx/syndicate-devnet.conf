# Syndicate devnet backend subdomains
# Deploy: sudo cp deploy/nginx/syndicate-devnet.conf /etc/nginx/sites-available/syndicate-devnet
#         sudo ln -s /etc/nginx/sites-available/syndicate-devnet /etc/nginx/sites-enabled/syndicate-devnet
#         sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (guide 04_DOMAIN_AND_TLS.md §4)
#
# Dev auth setup (one-time, on the server):
#   sudo sh -c "echo -n 'dev:' >> /etc/nginx/.htpasswd-syndicate-devnet"
#   sudo sh -c "openssl passwd -apr1 'choose-a-password' >> /etc/nginx/.htpasswd-syndicate-devnet"
#
# CORS note: add_header inside an `if` block replaces (not appends to) outer add_header directives
# for that condition — nginx `if` creates an internal nested location.  We rely on this: OPTIONS
# preflights get their own add_header set (no auth), all other requests get the outer add_header
# set (with auth).  Do NOT add more add_header directives outside the if blocks in these locations.

# Gateway — WebSocket proxy
server {
    listen 80;
    server_name gateway.devnet.satoshitable.fun;

    location /healthz {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Determine whether the Origin is in the dev allowlist.
        # set + if is safe here — we only set a variable, never proxy_pass inside if.
        set $cors_origin "";
        if ($http_origin ~* "^(https?://localhost(:[0-9]+)?|https://(www\.)?satoshitable\.fun)$") {
            set $cors_origin $http_origin;
        }

        # CORS preflight — must bypass auth (browsers send no credentials on OPTIONS).
        # add_header inside this if-block replaces outer add_header for OPTIONS requests.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age           3600;
            add_header Vary                             "Origin";
            return 204;
        }

        # CORS headers for actual requests (outer add_header applies when if above is false).
        add_header Access-Control-Allow-Origin      $cors_origin  always;
        add_header Access-Control-Allow-Credentials "true"        always;
        add_header Vary                             "Origin"      always;

        auth_basic "Syndicate Devnet";
        auth_basic_user_file /etc/nginx/.htpasswd-syndicate-devnet;

        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

