# Syndicate devnet backend subdomains
# Deploy: sudo cp deploy/nginx/syndicate-devnet.conf /etc/nginx/sites-available/syndicate-devnet
#         sudo ln -s /etc/nginx/sites-available/syndicate-devnet /etc/nginx/sites-enabled/syndicate-devnet
#         sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (guide 04_DOMAIN_AND_TLS.md §4)

# Gateway — WebSocket proxy
server {
    listen 80;
    server_name gateway.devnet.satoshitable.fun;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Action-feed REST
server {
    listen 80;
    server_name api.devnet.satoshitable.fun;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Config REST
server {
    listen 80;
    server_name config.devnet.satoshitable.fun;

    location / {
        proxy_pass http://127.0.0.1:18085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Signed-price feed — read-only (live ticker /ws + historical /prices/at)
# /internal/* and /metrics are unauthenticated on devnet — block them
server {
    listen 80;
    server_name price.devnet.satoshitable.fun;

    location ~* ^/(internal|metrics)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:18088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
