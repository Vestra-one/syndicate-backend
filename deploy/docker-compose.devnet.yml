# Devnet overrides: verbose logging + relaxed CORS.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.devnet.yml --env-file deploy/.env up -d
#
# Loopback port publishes (127.0.0.1:18080 / :18084 / :18088) now live in the BASE
# compose — they are the standard contract for the host reverse proxy, not a devnet-only
# debug affordance. Do not re-declare them here or the host-port binds collide.
services:
  game-server:
    environment:
      APP_ENV: devnet
      LOG_LEVEL: debug

  chain-worker:
    environment:
      APP_ENV: devnet
      LOG_LEVEL: debug
      # Timelock runs LIVE drand by default (production-like) — settlement decrypts real
      # tlock seals with the target round's published BLS signature. For a fast, offline
      # deterministic run, add the mock overlay: `-f deploy/docker-compose.mock.yml`
      # (and run the e2e with E2E_SEAL_MODE=mock).
