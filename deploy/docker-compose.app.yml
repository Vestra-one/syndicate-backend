name: syndicate-app

x-app-env: &app-env
  DATABASE_URL: postgres://syndicate:syndicate@postgres:5432/syndicate_local
  REDIS_URL: redis://redis:6379/0
  NATS_URL: nats://nats:4222
  ACTION_FEED_HOST: action-feed
  ACTION_FEED_PORT: 8080
  OBJECT_STORE_ENDPOINT: http://minio:9000
  PROMETHEUS_URL: http://prometheus:9090
  GRAFANA_URL: http://grafana:3000
  SOLANA_RPC_URL_PRIMARY: http://host.docker.internal:8899
  SETTLEMENT_CHAIN_URL: http://settlement-chain:8790

services:
  matchmaking:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node-service
      args:
        SERVICE: matchmaking
    env_file: ../docs/deployment/env.example
    environment:
      <<: *app-env
      MATCHMAKING_HOST: 0.0.0.0
      MATCHMAKING_PORT: 8082
      ORCHESTRATOR_URL: http://match-orchestrator:8086
      SYNDICATE_ORCHESTRATOR_STUB: ${SYNDICATE_ORCHESTRATOR_STUB:-0}
      SOLANA_RPC_URL: http://host.docker.internal:8899
    depends_on:
      - match-orchestrator
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18082:8082"

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node-service
      args:
        SERVICE: gateway
    env_file: ../docs/deployment/env.example
    environment:
      <<: *app-env
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8081
      GATEWAY_METRICS_PORT: 9081
      MATCH_ENGINE_URL: http://match-engine:8083
      MATCHMAKING_URL: http://matchmaking:8082
      ACTION_FEED_URL: http://action-feed:8080
    depends_on:
      - match-engine
      - matchmaking
      - action-feed
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18081:8081"
      - "19081:9081"

  action-feed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node-service
      args:
        SERVICE: action-feed
    env_file: ../docs/deployment/env.example
    environment:
      <<: *app-env
      ACTION_FEED_HOST: 0.0.0.0
      ACTION_FEED_PORT: 8080
      ACTION_FEED_OBJECT_STORE_DIR: /var/lib/syndicate/replays
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18080:8080"
    volumes:
      - action-feed-replays:/var/lib/syndicate/replays

  match-engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust-service
      args:
        PACKAGE: syndicate-engine
        BIN: syndicate-match-engine
    env_file: ../docs/deployment/env.example
    environment:
      <<: *app-env
      MATCH_ENGINE_HOST: 0.0.0.0
      MATCH_ENGINE_PORT: 8083
      MATCH_ENGINE_POSTGRES_LEASES: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18083:8083"

  match-orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust-service
      args:
        PACKAGE: syndicate-orchestrator
        BIN: syndicate-orchestrator
    env_file: ../docs/deployment/env.example
    environment:
      <<: *app-env
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: 8086
      SETTLEMENT_CHAIN_URL: http://settlement-chain:8790
      MATCH_ENGINE_URL: http://match-engine:8083
      SYNDICATE_ORCHESTRATOR_STUB: ${SYNDICATE_ORCHESTRATOR_STUB:-0}
    depends_on:
      - settlement-chain
      - match-engine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18086:8086"

  config:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node-service
      args:
        SERVICE: config
    environment:
      CONFIG_HOST: 0.0.0.0
      CONFIG_PORT: 8085
    ports:
      - "18085:8085"

  settlement-chain:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node-service
      args:
        SERVICE: settlement-chain
    env_file: ../docs/deployment/env.example
    environment:
      <<: *app-env
      SETTLEMENT_CHAIN_HOST: 0.0.0.0
      SETTLEMENT_CHAIN_PORT: 8790
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18790:8790"
    volumes:
      - ./secrets/settlement-chain.token:/etc/syndicate/settlement-chain.token:ro
      - ./secrets/settlement-admin-keypair.json:/etc/syndicate/settlement-admin-keypair.json:ro

  settlement-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust-worker
    env_file: ../docs/deployment/env.example
    environment:
      <<: *app-env
      APP_ENV: localnet
      SETTLEMENT_WORKER_MODE: production
      SETTLEMENT_WORKER_HOST: 0.0.0.0
      SETTLEMENT_WORKER_PORT: 8084
      SETTLEMENT_CHAIN_URL: http://settlement-chain:8790
      SETTLEMENT_STREAM_NAME: SETTLEMENT
      SETTLEMENT_CONSUMER_NAME: settlement-worker
      SETTLEMENT_RELAY_POLL_MS: 1000
      SETTLEMENT_POLLER_INTERVAL_MS: 5000
      SETTLEMENT_CONFIRMATION_TIMEOUT_MS: 60000
      SETTLEMENT_ACK_WAIT_MS: 60000
    depends_on:
      - settlement-chain
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18084:8084"
    volumes:
      - ./secrets/settlement-chain.token:/etc/syndicate/settlement-chain.token:ro
      - ./secrets/settlement-admin-keypair.json:/etc/syndicate/settlement-admin-keypair.json:ro
volumes:
  action-feed-replays:

networks:
  default:
    name: syndicate-localnet_default
    external: true
