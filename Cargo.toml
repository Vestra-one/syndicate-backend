# Syndicate backend — Rust workspace.
# `programs` (Anchor/Solana) is its own workspace (needs the Solana toolchain) and is
# intentionally excluded here so the deterministic core builds with zero external deps.
[workspace]
resolver = "2"
members = [
    "services/shared",
    "services/engine-core",
    "services/match-engine",
    "services/timelock",
    "services/store",
    "services/chain",
    "services/chain-worker",
    "services/game-server",
    "services/e2e",
]
# The Anchor program builds with the Solana toolchain (`anchor build`), not the host
# cargo workspace, so it is excluded here. It still links `services/shared` by path.
exclude = [
    "services/vendor/tlock",
    "services/programs",
]

# tlock 0.0.8 derives the IBE scalar differently from the reference implementations for
# about 9% of messages, and panics instead of returning an error on a failed check. The
# vendored copy fixes both (see services/vendor/tlock/src/ibe.rs, marked PATCHED).
[patch.crates-io]
tlock = { path = "services/vendor/tlock" }
